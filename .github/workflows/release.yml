name: Release

# TGTFTD release: builds Windows (x64, arm64) and macOS (universal) and publishes them as a GitHub Release.
# Run it from the Actions tab ("Run workflow"), with the branch or tag to build as "ref".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (e.g. seaplanes or tgtftd-0.1.0)'
        required: true
        default: 'seaplanes'

jobs:
  source:
    name: Source

    uses: ./.github/workflows/release-source.yml
    secrets: inherit

  macos:
    name: MacOS
    needs: source

    uses: ./.github/workflows/release-macos.yml
    secrets: inherit

    with:
      survey_key: ${{ needs.source.outputs.survey_key }}

  windows:
    name: Windows
    needs: source

    uses: ./.github/workflows/release-windows.yml
    secrets: inherit

    with:
      is_tag: ${{ needs.source.outputs.is_tag }}
      survey_key: ${{ needs.source.outputs.survey_key }}

  publish:
    name: Publish GitHub Release
    needs:
    - source
    - macos
    - windows

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download bundles
      uses: actions/download-artifact@v8
      with:
        pattern: openttd-*
        path: bundles
        merge-multiple: true

    - name: List bundles
      run: ls -la bundles

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.source.outputs.version }}
        target_commitish: ${{ github.event.inputs.ref }}
        name: TGTFTD ${{ needs.source.outputs.version }}
        prerelease: ${{ !startsWith(needs.source.outputs.version, 'tgtftd-') }}
        body: |
          TGTFTD build ${{ needs.source.outputs.version }}, based on JGR's Patch Pack.

          * **Windows**: download the `windows-win64` (or `windows-arm64`) zip, extract it and run `openttd.exe`.
          * **macOS**: download the `macos-universal` zip and extract it. The app is not signed by Apple: right-click it and choose **Open** the first time, or run `xattr -dr com.apple.quarantine /path/to/OpenTTD.app`.

          You still need base graphics (OpenGFX can be downloaded from the in-game "Check online content" menu, or copy the original TTD files).

          Seaplane and seaplane terminal NewGRF documentation: see `docs/tgtftd-seaplanes.md` in the repository.
        files: bundles/*
        fail_on_unmatched_files: false
