name: Release

# TGTFTD release: builds Windows x64 and macOS Apple Silicon (arm64) bundles as workflow artifacts.
# Run it from the Actions tab ("Run workflow"), with the branch or tag to build as "ref" (e.g. tgtftd-0.1.1).
#
# The GitHub release itself is published from a local machine with tools/publish_release.py, which downloads
# these artifacts and uploads the plain bundle files (the Actions token is not allowed to create releases here).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (e.g. seaplanes or tgtftd-0.1.0)'
        required: true
        default: 'seaplanes'

jobs:
  source:
    name: Source

    uses: ./.github/workflows/release-source.yml
    secrets: inherit

  macos:
    name: MacOS
    needs: source

    uses: ./.github/workflows/release-macos.yml
    secrets: inherit

    with:
      survey_key: ${{ needs.source.outputs.survey_key }}

  windows:
    name: Windows
    needs: source

    uses: ./.github/workflows/release-windows.yml
    secrets: inherit

    with:
      is_tag: ${{ needs.source.outputs.is_tag }}
      survey_key: ${{ needs.source.outputs.survey_key }}
